# config/memdevassess.conf 

TARGETDEV_REMOTE_ATOP_DIR="${TARGETDEV_REMOTE_ATOP_DIR:-/var/log/atop}"
TARGETDEV_MAX_PARALLEL="${TARGETDEV_MAX_PARALLEL:-2}"
TARGETDEV_MEM_THRESHOLD="${TARGETDEV_MEM_THRESHOLD:-85}"
TARGETDEV_SSH_OPTS="${TARGETDEV_SSH_OPTS:--q -o BatchMode=yes -o ConnectTimeout=10 -o GSSAPIAuthentication=no}"

export TARGETDEV_REMOTE_ATOP_DIR TARGETDEV_MAX_PARALLEL TARGETDEV_SSH_OPTS TARGETDEV_MEM_THRESHOLD
