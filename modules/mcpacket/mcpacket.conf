# config/mcpacket.conf 

MCPACKET_REMOTE_DATA_BASE="${MCPACKET_REMOTE_DATA_BASE:-/home/app/data/diagnosticreport}"
MCPACKET_FILTER_KEY0="${MCPACKET_FILTER_KEY0:-RtpMulticast}"
MCPACKET_FILTER_KEY1="${MCPACKET_FILTER_KEY1:-PacketsReceived}"
MCPACKET_FILTER_KEY2="${MCPACKET_FILTER_KEY2:-PacketsExpected}"
MCPACKET_FILTER_KEY3="${MCPACKET_FILTER_KEY3:-PacketsLost}"
MCPACKET_FILE_GLOB="${MCPACKET_FILE_GLOB:-rep_*}"
MCPACKET_MAX_PARALLEL="${MCPACKET_MAX_PARALLEL:-2}"
MCPACKET_LOSS_THRESHOLD="${MCPACKET_LOSS_THRESHOLD:-0.0001}"
MCPACKET_SSH_OPTS="${MCPACKET_SSH_OPTS:--n -o BatchMode=yes -o ConnectTimeout=10 -q}"

export MCPACKET_REMOTE_DATA_BASE MCPACKET_TARGET_DATE MCPACKET_TARGET_TIME MCPACKET_FILE_GLOB
export MCPACKET_FILTER_KEY0 MCPACKET_FILTER_KEY1 MCPACKET_FILTER_KEY2 MCPACKET_FILTER_KEY3
export MCPACKET_MAX_PARALLEL MCPACKET_SSH_OPTS MCPACKET_LOSS_THRESHOLD
