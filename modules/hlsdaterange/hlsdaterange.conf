# config/hlsdaterange.conf 

HLSDATERANGE_FILTER_KEY0="${HLSDATERANGE_FILTER_KEY0:-"DATERANGE"}"
HLSDATERANGE_FILTER_KEY1="${HLSDATERANGE_FILTER_KEY1:-"RECORD_PATH"}"
HLSDATERANGE_FILTER_KEY2="${HLSDATERANGE_FILTER_KEY2:-"CHANNEL_DESCRITION"}"
HLSDATERANGE_FILE_GLOB="${HLSDATERANGE_FILE_GLOB:-"*.idx"}"
HLSDATERANGE_MAX_PARALLEL="${HLSDATERANGE_MAX_PARALLEL:-2}"
HLSDATERANGE_SSH_OPTS="${HLSDATERANGE_SSH_OPTS:--o BatchMode=yes -o ConnectTimeout=10 -q}"

export HLSDATERANGE_FILTER_KEY0 HLSDATERANGE_FILTER_KEY1 HLSDATERANGE_FILTER_KEY2 HLSDATERANGE_FILE_GLOB
export HLSDATERANGE_MAX_PARALLEL HLSDATERANGE_SSH_OPTS
