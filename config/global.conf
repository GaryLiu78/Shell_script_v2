# config/global.conf

export PROJECT_NAME="Daily_Tasks"
export PROJECT_VERSION="0.9.0"

: "${LOG_BASE_DIR:=${PROJECT_ROOT}/var/log}"
: "${TEMP_RUN_DIR:=${PROJECT_ROOT}/var/tmp/run}"
: "${TEMP_KEEP_DIR:=${PROJECT_ROOT}/var/tmp/keep}"
: "${INPUT_BASE_DIR:=${PROJECT_ROOT}/var/input}"
: "${RESULT_BASE_DIR:=${PROJECT_ROOT}/var/result}"
: "${LIB_BASE_DIR:=${PROJECT_ROOT}/lib}"
: "${MODULES_BASE_DIR:=${PROJECT_ROOT}/modules}"
: "${PIPELINES_BASE_DIR:=${PROJECT_ROOT}/pipelines}"
: "${CONFIG_DIR:=${PROJECT_ROOT}/config}"

LOG_LEVEL="${LOG_LEVEL:-INFO}"
LOG_RETENTION_DAYS="${LOG_RETENTION_DAYS:-7}"
LOG_MAX_SIZE_MB="${LOG_MAX_SIZE_MB:-100}"

CLEANUP_RETENTION_DAYS="${CLEANUP_RETENTION_DAYS:-7}"

export LOG_BASE_DIR RESULT_BASE_DIR MODULES_BASE_DIR LIB_BASE_DIR PIPELINES_BASE_DIR CONFIG_DIR
export TEMP_RUN_DIR TEMP_KEEP_DIR
export LOG_LEVEL LOG_RETENTION_DAYS LOG_MAX_SIZE_MB CLEANUP_RETENTION_DAYS

